name: 🔗 Backlink Machine

on:
  schedule:
    # Runs daily at 10:00 AM IST (4:30 AM UTC)
    - cron: '30 4 * * *'
  workflow_dispatch:
    # Manual trigger from GitHub UI
    inputs:
      limit:
        description: 'Number of targets to scrape'
        required: false
        default: '10'
        type: choice
        options:
          - '5'
          - '10'
          - '20'
          - '50'

jobs:
  scrape-and-generate:
    name: Scrape targets & generate emails
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ⚡ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: |
          npm install playwright@latest resend
          npx playwright install chromium

      - name: 🎯 Run scraper
        run: node scripts/backlink-machine/scraper.cjs --limit ${{ inputs.limit || '10' }}
        timeout-minutes: 10

      - name: 📧 Generate outreach emails
        run: node scripts/backlink-machine/generate-emails.cjs
        continue-on-error: true

      - name: 📊 Show dashboard
        run: node scripts/backlink-machine/dashboard.cjs

      - name: 💾 Commit updated data
        run: |
          git config user.name "Backlink Machine"
          git config user.email "bot@reviewping.pro"
          git add backlink-data/ -A
          git diff --staged --quiet || git commit -m "chore: backlink data update $(date +'%Y-%m-%d')"
          git push
